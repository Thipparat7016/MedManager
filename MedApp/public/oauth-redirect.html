<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MedManager - เข้าสู่ระบบด้วย Google</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      padding: 28px;
      color: #0F172A;
    }
    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      border: 1.5px solid #C7D2FE;
      background-color: #F5F6FF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 36px;
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .primary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      background-color: #8B95F6;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(139, 149, 246, 0.3);
    }
    .primary-btn:active {
      opacity: 0.85;
    }
    .fallback-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 13px;
      color: #64748B;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box">💊</div>
    <div class="brand">MedManager</div>
    <p class="subtitle" id="status-text">ยืนยันบัญชี Google เรียบร้อยแล้ว<br/>กดปุ่มด้านล่างเพื่อกลับเข้าสู่แอป</p>
    <a id="open-app-btn" class="primary-btn" href="#">ดำเนินการต่อเข้าสู่แอป</a>
    <a id="fallback-btn" class="fallback-link" href="#">หากแอปไม่เปิดอัตโนมัติ แตะที่นี่</a>
  </div>

  <script>
    (function () {
      var forwardParams = new URLSearchParams();
      var allowedKeys = ['access_token', 'refresh_token', 'code', 'error', 'error_description'];

      if (window.location.search && window.location.search.length > 1) {
        var searchParams = new URLSearchParams(window.location.search.substring(1));
        searchParams.forEach(function (val, key) {
          if (allowedKeys.indexOf(key) !== -1) {
            forwardParams.set(key, val);
          }
        });
      }

      if (window.location.hash && window.location.hash.length > 1) {
        var hashParams = new URLSearchParams(window.location.hash.substring(1));
        hashParams.forEach(function (val, key) {
          if (allowedKeys.indexOf(key) !== -1) {
            forwardParams.set(key, val);
          }
        });
      }

      // ล้าง Token ออกจากแถบ URL ของเบราว์เซอร์เพื่อความปลอดภัย
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      var host = window.location.host;
      var queryString = forwardParams.toString();
      var suffix = queryString ? '?' + queryString : '';

      var expUrl = 'exp://' + host + '/--/login' + suffix;
      var androidIntentUrl =
        'intent://' +
        host +
        '/--/login' +
        suffix +
        '#Intent;scheme=exp;package=host.exp.exponent;end';

      var isAndroid = /Android/i.test(navigator.userAgent || '');
      var mainBtn = document.getElementById('open-app-btn');
      var fallbackBtn = document.getElementById('fallback-btn');
      var statusText = document.getElementById('status-text');

      if (forwardParams.get('error') || forwardParams.get('error_description')) {
        statusText.innerHTML = 'ไม่สามารถยืนยันตัวตนได้<br/>กดปุ่มด้านล่างเพื่อกลับไปยังหน้าเข้าสู่ระบบ';
      }

      if (isAndroid) {
        mainBtn.setAttribute('href', androidIntentUrl);
        fallbackBtn.setAttribute('href', expUrl);
      } else {
        mainBtn.setAttribute('href', expUrl);
        fallbackBtn.setAttribute('href', 'medapp://login' + suffix);
        // บน iOS สามารถเด้งกลับเข้าแอปอัตโนมัติได้ทันทีโดยไม่โดน Chrome บล็อก
        setTimeout(function () {
          window.location.replace(expUrl);
        }, 50);
      }
    })();
  </script>
</body>
</html>
